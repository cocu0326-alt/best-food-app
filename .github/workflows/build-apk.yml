name: Build Best Food APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Check app JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/best-food-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/best-food-inline.js
      - name: Validate app controls and event handlers
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          script = '\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I))
          class Controls(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicates = set()
                  self.handlers = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      if attrs['id'] in self.ids: self.duplicates.add(attrs['id'])
                      self.ids.add(attrs['id'])
                  for key, value in attrs.items():
                      if key.startswith('on') and value:
                          self.handlers.append(value)
          controls = Controls()
          controls.feed(html)
          assert not controls.duplicates, f'Duplicate HTML IDs: {controls.duplicates}'
          referenced = set(re.findall(r"""document\.getElementById\(["']([^"']+)["']\)""", script))
          missing = referenced - controls.ids
          assert not missing, f'Missing DOM controls: {sorted(missing)}'
          functions = set(re.findall(r'function\s+([A-Za-z_$][\w$]*)\s*\(', script))
          for handler in controls.handlers:
              match = re.match(r'\s*([A-Za-z_$][\w$]*)\s*\(', handler)
              if match and match.group(1) not in functions:
                  raise AssertionError(f'Unknown event handler: {handler}')
          required_controls = {'quickSearch', 'measureFilter', 'priceDropsOnly', 'sort', 'maxUnitPrice', 'minRating', 'minReviews'}
          absent = required_controls - controls.ids
          assert not absent, f'Missing essential product filters: {sorted(absent)}'
          reset = re.search(r'function\s+clearProductFilters\s*\(\)\s*\{([^}]*)\}', script)
          assert reset, 'Missing product filter reset handler'
          for control in required_controls:
              assert f"getElementById('{control}')" in reset.group(1), f'Filter not reset: {control}'
          assert 'resetProductPage()' in script, 'Missing filter-triggered pagination reset'
          print(f'Validated {len(controls.ids)} control IDs and {len(controls.handlers)} event handlers; all product filters reset')
          PY
      - name: Verify Android export contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          native = Path('app/src/main/java/kr/bestfood/app/MainActivity.kt').read_text(encoding='utf-8')
          filenames = ('best-food-backup.json', 'best-food-products.csv', 'best-food-price-changes.csv')
          for filename in filenames:
              assert filename in html, f'Web export missing: {filename}'
              assert filename in native, f'Android export whitelist missing: {filename}'
          assert 'new TextEncoder().encode(content).length>2000000' in html, 'Web export must enforce UTF-8 byte limit'
          assert 'val bytes = content.toByteArray(Charsets.UTF_8)' in native, 'Android export must encode UTF-8'
          assert 'if (bytes.size > 2_000_000) return' in native, 'Android export must enforce UTF-8 byte limit'
          assert 'private var pendingSave: ByteArray? = null' in native, 'Android must retain validated export bytes'
          assert 'stream.use { it.write(content) }' in native, 'Android must write validated bytes'
          assert "saveDownload('best-food-backup.json','application/json'" in html, 'Backup MIME mismatch'
          for filename in filenames[1:]:
              assert f"saveDownload('{filename}','text/csv;charset=utf-8'" in html, f'CSV MIME mismatch: {filename}'
          assert 'mime != expectedMime' in native, 'Android MIME validation missing'
          assert 'val expectedMime = if (name == "best-food-backup.json") "application/json" else "text/csv;charset=utf-8"' in native, 'Android MIME mapping missing'
          assert 'Intent.ACTION_CREATE_DOCUMENT' in native, 'Android save dialog missing'
          print('Web and Android export filenames, byte limits, and save dialog verified')
          PY
      - name: Verify Android WebView security configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native = Path('app/src/main/java/kr/bestfood/app/MainActivity.kt').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          required = (
              'allowFileAccessFromFileURLs = false',
              'allowUniversalAccessFromFileURLs = false',
              'javaScriptCanOpenWindowsAutomatically = false',
              'setSupportMultipleWindows(false)',
              'MIXED_CONTENT_NEVER_ALLOW',
              'safeBrowsingEnabled = true',
              'setWebContentsDebuggingEnabled(false)',
          )
          for setting in required:
              assert setting in native, f'Missing WebView security setting: {setting}'
          assert 'android:usesCleartextTraffic="false"' in manifest, 'Cleartext traffic must be disabled'
          assert 'web.loadUrl("file:///android_asset/index.html")' in native, 'Unexpected app entrypoint'
          print('Android WebView security settings verified')
          PY
      - name: Test supplier API server
        run: node --test server/server.test.mjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK contents
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              required={'AndroidManifest.xml','classes.dex','assets/index.html'}
              missing=required-names
              if missing:
                  raise SystemExit('APK missing: '+', '.join(sorted(missing)))
              html=z.read('assets/index.html').decode('utf-8')
              if 'fetchProducts' not in html or 'renderCompare' not in html:
                  raise SystemExit('APK contains incomplete application assets')
          print('APK package and embedded application verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: best-food-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
