name: Consumer price CSV tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  csv-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run consumer price CSV regression tests
        run: node --test server/consumer-price-csv.test.mjs server/naver-shopping.test.mjs
      - name: Check Android WebView JavaScript syntax
        run: node server/check-android-webview-syntax.mjs
