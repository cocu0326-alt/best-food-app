name: Android APK build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/best-food-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/best-food-inline.js
      - name: Check export integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          native = Path('app/src/main/java/kr/bestfood/app/MainActivity.kt').read_text(encoding='utf-8')
          assert 'function saveDownload(' in html
          assert html.count('saveDownload(') == 4, 'Expected one helper and three export calls'
          assert 'fun saveText(' in native
          assert 'Intent.ACTION_CREATE_DOCUMENT' in native
          assert 'Intent.ACTION_OPEN_DOCUMENT' in native
          assert 'JavascriptInterface' in native
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android.permission.INTERNET' in manifest
          assert 'if (pendingSave != null)' in native
          assert 'stream.use { it.write(' in native
          assert 'Toast.makeText' in native
          print('Export integration checks passed')
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          size = apk.stat().st_size
          assert size > 100_000, f'APK unexpectedly small: {size} bytes'
          print(f'APK generated: {size:,} bytes')
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: best-food-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Upload Android lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 14
