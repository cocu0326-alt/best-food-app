name: Android APK build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/best-food-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/best-food-inline.js
      - name: Check export integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          native = Path('app/src/main/java/kr/bestfood/app/MainActivity.kt').read_text(encoding='utf-8')
          assert 'function saveDownload(' in html
          assert html.count('saveDownload(') == 4, 'Expected one helper and three export calls'
          assert 'fun saveText(' in native
          assert 'Intent.ACTION_CREATE_DOCUMENT' in native
          assert 'Intent.ACTION_OPEN_DOCUMENT' in native
          assert 'JavascriptInterface' in native
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android.permission.INTERNET' in manifest
          assert 'if (pendingSave != null)' in native
          assert 'stream.use { it.write(' in native
          assert 'Toast.makeText' in native
          assert 'Array.isArray(state.products)' in html
          assert 'try{localStorage.setItem(KEY' in html
          assert 'frame-src \'none\'' in html
          print('Export integration checks passed')
          PY
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/best-food-build.log
      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-log
          path: /tmp/best-food-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          size = apk.stat().st_size
          assert size > 100_000, f'APK unexpectedly small: {size} bytes'
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
              assert 'AndroidManifest.xml' in names, 'Android manifest missing from APK'
              assert 'assets/index.html' in names, 'App UI missing from APK'
              assert any(name.startswith('classes') and name.endswith('.dex') for name in names), 'DEX code missing from APK'
              assert archive.testzip() is None, 'APK ZIP contains corrupt entry'
          print(f'APK verified: {size:,} bytes, manifest, UI, DEX and ZIP integrity OK')
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: best-food-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK metadata with Android build tools
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/best-food-apk-badging.txt
          grep -q "package: name='kr.bestfood.app'" /tmp/best-food-apk-badging.txt
          grep -q "launchable-activity: name='kr.bestfood.app.MainActivity'" /tmp/best-food-apk-badging.txt
          grep -q "sdkVersion:'24'" /tmp/best-food-apk-badging.txt
      - name: Run Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - name: Upload Android lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 14
