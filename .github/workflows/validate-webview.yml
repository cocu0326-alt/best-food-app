name: Validate Android WebView UI
on:
  push:
    paths:
      - 'app/src/main/assets/index.html'
      - 'scripts/check-webview.mjs'
      - '.github/workflows/validate-webview.yml'
  pull_request:
    paths:
      - 'app/src/main/assets/index.html'
      - 'scripts/check-webview.mjs'
      - '.github/workflows/validate-webview.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-webview.mjs
