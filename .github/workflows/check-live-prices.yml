name: Check official live food prices
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real Korean Consumer Agency weekly price feed
        run: node scripts/check-live-prices.mjs
