name: Test food search server
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/test-food-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/test-food-server.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server syntax
        run: node --check server/index.mjs
      - name: Run supplier feed tests
        run: node --test server/*.test.mjs
