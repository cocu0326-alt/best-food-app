name: Android debug APK build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner SDK
        run: |
          mkdir -p build-reports
          set -o pipefail
          test -n "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee build-reports/android-sdk.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate WebView JavaScript and survey CSV parser
        run: |
          mkdir -p build-reports
          set -o pipefail
          {
            node server/check-android-webview-syntax.mjs &&
            node scripts/check-webview.mjs &&
            node --test server/consumer-price-csv.test.mjs server/demo-consumer-prices.test.mjs server/naver-shopping.test.mjs server/http-api.test.mjs
          } 2>&1 | tee build-reports/webview-tests.log
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build-reports/gradle-build.log
      - name: Verify generated APK and package identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='kr.bestfood.app'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: best-food-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: best-food-build-logs
          path: build-reports/*.log
          if-no-files-found: warn
          retention-days: 30
